name = "hat-flash-billing"
main = "src/index.ts"
compatibility_date = "2026-06-03"

[vars]
# Configure these public redirect URLs for Stripe Checkout and Customer Portal.
STRIPE_CHECKOUT_SUCCESS_URL = "https://hat-flash.com/billing/success"
STRIPE_CHECKOUT_CANCEL_URL = "https://hat-flash.com/billing/cancel"
STRIPE_PORTAL_RETURN_URL = "https://hat-flash.com/billing"

# Set with `wrangler secret put`:
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# FIREBASE_PROJECT_ID
# STRIPE_PRICE_GO
# STRIPE_PRICE_PRO
# STRIPE_PRICE_ULTRA

[[kv_namespaces]]
binding = "BILLING_KV"
id = "replace-with-production-kv-id"
preview_id = "replace-with-preview-kv-id"
