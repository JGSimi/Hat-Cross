[package]
name = "hat-cross"
version = "2.36.2"
description = "Hat — AI Assistant"
authors = ["JGSimi"]
edition = "2021"

[lib]
name = "hat_cross_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
once_cell = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

# Temporary patch: tao 0.34.8 panics in CursorIgnoreEvents when a window
# is dispatched `set_ignore_cursor_events(true)` before its GdkWindow is
# realized (transparent+hidden windows, see tauri-apps/tao#1178). The
# panic crosses a non-unwinding GTK main-loop boundary and aborts the
# whole process — users on Fedora 43+ / Wayland saw the app open blank
# and die. Our fork just replaces the bare `unwrap()` with an
# `if let Some(_)` skip. Revert this block to crates.io once the fix
# lands upstream and a tao release cuts through to tauri-runtime-wry.
[patch.crates-io]
tao = { git = "https://github.com/JGSimi/tao", branch = "fix-cursor-ignore-unwrap" }
