name: Sync Beta Channel Now

on:
  push:
    branches:
      - 'channel-sync/beta7'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BETA_TAG: hat-beta-v2.2.0-beta.7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-channel
          fetch-depth: 0

      - name: Download beta latest.json
        run: |
          rm -rf /tmp/hat-beta-channel
          mkdir -p /tmp/hat-beta-channel
          gh release download "$BETA_TAG" \
            --repo "${{ github.repository }}" \
            --pattern latest.json \
            --dir /tmp/hat-beta-channel
          cp /tmp/hat-beta-channel/latest.json ./latest.json

      - name: Publish beta channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "channel(beta): $BETA_TAG"
          git push origin HEAD:beta-channel
