name: Tag Hat v2.2.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'release: Hat v2.2.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stable release tag
        run: |
          git tag hat-app-v2.2.1
          git push origin hat-app-v2.2.1
