name: Hat Beta (Jev)

on:
  workflow_dispatch:
  push:
    tags:
      - 'hat-beta-v*'
    branches:
      - 'release/hat-beta-2.2.0-beta.10'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VITE_HAT_VARIANT: beta-jev
      HAT_APP_VARIANT: beta-jev
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/hat/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hat/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/hat
        run: npm ci

      - name: Test frontend
        working-directory: apps/hat
        run: npm test

      - name: Build beta prerelease + updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/hat
          args: --config src-tauri/tauri.beta.conf.json --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'hat-beta-v2.2.0-beta.10' }}
          releaseName: 'Hat Beta 2.2.0-beta.10'
          releaseBody: |
            Beta experimental do Hat.

            - Screen Solve solicita Acessibilidade pela API AX do macOS.
            - Se o alerta do TCC não aparecer, abre o painel de Acessibilidade automaticamente.
            - Cliques e Cmd+V usam Core Graphics, sem System Events/osascript.
            - Canal Beta de atualização automática separado do Stable.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false

  publish-beta-channel:
    name: Publicar canal Beta
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BETA_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'hat-beta-v2.2.0-beta.10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-channel
          fetch-depth: 0

      - name: Baixar assinaturas da prerelease
        run: |
          rm -rf /tmp/hat-beta-assets
          mkdir -p /tmp/hat-beta-assets
          gh release download "$BETA_TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.sig' \
            --dir /tmp/hat-beta-assets
          gh api "repos/${{ github.repository }}/releases/tags/$BETA_TAG" > /tmp/release.json

      - name: Montar latest.json multiplataforma
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime, timezone

          tag = os.environ["BETA_TAG"]
          repo = os.environ["REPOSITORY"]
          release = json.load(open("/tmp/release.json"))
          names = [a["name"] for a in release["assets"]]
          sig_dir = Path("/tmp/hat-beta-assets")

          def signature_for(asset):
              p = sig_dir / f"{asset}.sig"
              if not p.exists():
                  raise SystemExit(f"assinatura ausente para {asset}")
              return p.read_text().strip()

          def url_for(asset):
              return f"https://github.com/{repo}/releases/download/{tag}/{quote(asset)}"

          def find_one(predicate, label):
              matches = [n for n in names if predicate(n)]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: esperado 1 asset, encontrei {matches}")
              return matches[0]

          win = find_one(
              lambda n: n.endswith("_x64-setup.exe"),
              "windows-x86_64",
          )
          mac_arm = find_one(
              lambda n: n.endswith(".app.tar.gz")
              and ("aarch64" in n.lower() or "arm64" in n.lower()),
              "darwin-aarch64",
          )
          mac_intel = find_one(
              lambda n: n.endswith(".app.tar.gz")
              and ("x86_64" in n.lower() or "x64" in n.lower()),
              "darwin-x86_64",
          )

          platforms = {}
          for key, asset in [
              ("windows-x86_64", win),
              ("darwin-aarch64", mac_arm),
              ("darwin-x86_64", mac_intel),
          ]:
              platforms[key] = {
                  "signature": signature_for(asset),
                  "url": url_for(asset),
              }

          manifest = {
              "version": "2.2.0-beta.10",
              "notes": "Hat Beta: Screen Solve com permissões nativas e canal Beta automático.",
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Publicar latest.json no beta-channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "channel(beta): $BETA_TAG"
          git push origin HEAD:beta-channel
