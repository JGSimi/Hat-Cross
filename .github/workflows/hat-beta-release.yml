name: Hat Beta (Jev)

on:
  workflow_dispatch:
  push:
    tags:
      - 'hat-beta-v*'
    branches:
      - 'release/hat-beta-2.2.0-beta.7'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VITE_HAT_VARIANT: beta-jev
      HAT_APP_VARIANT: beta-jev
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/hat/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hat/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/hat
        run: npm ci

      - name: Test frontend
        working-directory: apps/hat
        run: npm test

      - name: Build beta prerelease + updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/hat
          args: --config src-tauri/tauri.beta.conf.json --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'hat-beta-v2.2.0-beta.7' }}
          releaseName: 'Hat Beta 2.2.0-beta.7'
          releaseBody: |
            Beta experimental do Hat.

            Esta versão é instalada separadamente e não substitui o Hat estável.
            A partir desta versão, atualizações Beta são baixadas automaticamente
            pelo canal Beta e nunca pelo canal Stable.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true

  publish-beta-channel:
    name: Publicar canal Beta
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BETA_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'hat-beta-v2.2.0-beta.7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-channel
          fetch-depth: 0

      - name: Baixar latest.json da prerelease
        run: |
          rm -rf /tmp/hat-beta-channel
          mkdir -p /tmp/hat-beta-channel
          gh release download "$BETA_TAG" \
            --repo "${{ github.repository }}" \
            --pattern latest.json \
            --dir /tmp/hat-beta-channel
          cp /tmp/hat-beta-channel/latest.json ./latest.json

      - name: Publicar latest.json no beta-channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "channel(beta): $BETA_TAG"
          git push origin HEAD:beta-channel
