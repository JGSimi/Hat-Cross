name: 'Auto Version & Release'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.github/workflows/**'

jobs:
  version-bump:
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.version }}
      bumped: ${{ steps.bump.outputs.type != 'none' && 'true' || 'false' }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump type
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
          fi
          echo "Commits since last tag:"
          echo "$COMMITS"

          if echo "$COMMITS" | grep -qi "BREAKING CHANGE\|!:"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qi "^[a-f0-9]* feat"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qi "^[a-f0-9]* fix\|^[a-f0-9]* chore\|^[a-f0-9]* perf\|^[a-f0-9]* style\|^[a-f0-9]* refactor"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.bump.outputs.type != 'none'
        id: version
        run: |
          CURRENT=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

      - name: Commit and tag
        if: steps.bump.outputs.type != 'none'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # Build and release — runs after version bump
  build-release:
    needs: version-bump
    if: needs.version-bump.outputs.bumped == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # Ubuntu 24.04 (not 22.04): binaries built on 22.04 link against
          # glibc 2.35 / libglib 2.72 and panic on startup when run on modern
          # distros like Fedora 43+ (glibc 2.40, libglib 2.84) — the panic
          # surfaces inside `glib::main_context_channel::dispatch`, but the
          # root cause is ABI drift between build-time and runtime glib.
          # 24.04 ships glibc 2.39 / libglib 2.80 which stays compatible with
          # current distros. Do not downgrade without re-testing on Fedora/Arch.
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # Pinned to 1.94.1: rustc 1.95.0 produces Linux binaries that panic on
      # startup with `Option::unwrap() on a None value` inside
      # `glib::main_context_channel::dispatch` (tao event loop) when run on
      # Fedora 43+/Arch with modern libglib. v2.36.0 shipped broken Linux
      # artifacts because of this. Do not bump without re-testing on a modern
      # Linux distro (not just the build runner).
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libpipewire-0.3-dev libspa-0.2-dev xdg-utils

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Vite inlines these into the final bundle at build time — without
          # them, released binaries ship with `undefined` Firebase / OAuth
          # config and sign-in dies on launch with "OAuth não configurado".
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        with:
          tagName: v${{ needs.version-bump.outputs.new_version }}
          releaseName: 'Hat v${{ needs.version-bump.outputs.new_version }}'
          releaseBody: |
            Os downloads estão sendo preparados... A lista organizada será atualizada em breve.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Organize release assets into a user-friendly body
  organize-release:
    needs: [version-bump, build-release]
    if: always() && needs.version-bump.outputs.bumped == 'true' && needs.version-bump.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version-bump.outputs.new_version }}
      VERSION: ${{ needs.version-bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build organized release body
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          if [ -z "$ASSETS" ]; then
            echo "::warning::No assets found for release ${TAG}"
            exit 0
          fi

          link_or_missing() {
            local filename="$1"
            local label="$2"
            if echo "$ASSETS" | grep -qx "$filename"; then
              echo "| ${label} | [📥 Download](${BASE_URL}/${filename}) |"
            else
              echo "| ${label} | _Indisponível nesta versão_ |"
            fi
          }

          WIN_EXE="Hat_${VERSION}_x64-setup.exe"
          MAC_ARM="Hat_${VERSION}_aarch64.dmg"
          MAC_INTEL="Hat_${VERSION}_x64.dmg"
          LINUX_DEB="Hat_${VERSION}_amd64.deb"
          LINUX_APPIMAGE="Hat_${VERSION}_amd64.AppImage"
          LINUX_RPM="Hat-${VERSION}-1.x86_64.rpm"
          LINUX_ARM64_DEB="Hat_${VERSION}_arm64.deb"
          LINUX_ARM64_APPIMAGE="Hat_${VERSION}_aarch64.AppImage"
          LINUX_ARM64_RPM="Hat-${VERSION}-1.aarch64.rpm"

          UPDATER_FILES=""
          while IFS= read -r asset; do
            case "$asset" in
              *.sig|*.nsis.zip|*.tar.gz|latest.json)
                UPDATER_FILES="${UPDATER_FILES}
          - [\`${asset}\`](${BASE_URL}/${asset})"
                ;;
            esac
          done <<< "$ASSETS"

          cat > /tmp/release-body.md << EOF
          ## Download — Hat v${VERSION}

          Escolha o instalador para sua plataforma abaixo.

          ---

          ### 🪟 Windows

          | Versão | Link |
          |--------|------|
          $(link_or_missing "$WIN_EXE" "Windows 64-bit (.exe)")

          > Se o Windows SmartScreen aparecer, clique em **Mais informações** → **Executar mesmo assim**.

          ---

          ### 🍎 macOS

          | Processador | Link |
          |-------------|------|
          $(link_or_missing "$MAC_ARM" "Apple Silicon — M1, M2, M3, M4")
          $(link_or_missing "$MAC_INTEL" "Intel (x86_64)")

          > **Não sabe qual escolher?** Clique em  → **Sobre este Mac**. Se mostrar chip **M1/M2/M3/M4**, baixe **Apple Silicon**. Caso contrário, baixe **Intel**.

          > O app não é notarizado (sem Apple Developer Account). Na primeira abertura:
          > 1. Clique direito no app → **Abrir**
          > 2. Clique **Abrir** no diálogo de segurança
          > 3. Ou execute no terminal: \`xattr -cr /Applications/Hat.app\`

          ---

          ### 🐧 Linux

          #### Intel / AMD 64-bit (x86_64)

          | Formato | Link |
          |---------|------|
          $(link_or_missing "$LINUX_DEB" "Debian / Ubuntu (.deb)")
          $(link_or_missing "$LINUX_APPIMAGE" "AppImage (universal)")
          $(link_or_missing "$LINUX_RPM" "Fedora / openSUSE (.rpm)")

          #### ARM 64-bit (aarch64) — Raspberry Pi, Asahi, etc.

          | Formato | Link |
          |---------|------|
          $(link_or_missing "$LINUX_ARM64_DEB" "Debian / Ubuntu (.deb)")
          $(link_or_missing "$LINUX_ARM64_APPIMAGE" "AppImage (universal)")
          $(link_or_missing "$LINUX_ARM64_RPM" "Fedora / openSUSE (.rpm)")

          > Não sabe qual escolher? Rode \`uname -m\` no terminal: \`x86_64\` → Intel/AMD; \`aarch64\` → ARM.

          ---

          O app inclui **auto-update** — você será notificado automaticamente quando houver novas versões.

          <details>
          <summary>📦 Arquivos do atualizador (uso interno)</summary>

          Estes arquivos são usados pelo sistema de auto-update e não precisam ser baixados manualmente.
          ${UPDATER_FILES}

          </details>
          EOF

          sed -i 's/^          //' /tmp/release-body.md

      - name: Update release body
        run: |
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --notes-file /tmp/release-body.md
